name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest

      # Archived evidence: checksums, then the independent re-derivations that
      # need no model download. The 128-object ReProver archive is what the
      # first AUC 0.786 was measured on, so it is checked, not just stored.
      - run: cd results/state-object-v1 && sha256sum -c SHA256SUMS
      - run: python scripts/verify-state-object-archive.py --corpus results/state-object-v1/corpus.json.gz --analysis results/state-object-v1 --out "$RUNNER_TEMP/verification.json"
      - run: cmp "$RUNNER_TEMP/verification.json" results/state-object-v1/verification.json

      # The forward test's label: every citation in new-connectors.json must be a
      # whole-name hit in the committed grep output, never a prefix of a longer
      # name. The full rebuild needs a Mathlib checkout; this check does not.
      - run: python scripts/build-forward-label.py --check
      - run: cd results/historical-connections-v1 && sha256sum -c SHA256SUMS
      - run: cd results/encoder-invariance-v1 && sha256sum -c SHA256SUMS
      - run: cd results/encoder-comparison-v1 && sha256sum -c SHA256SUMS
      - run: cd results/semantic-encoder-evaluation-v1 && sha256sum -c SHA256SUMS
      - run: cd results/state-consistency-v1 && sha256sum -c SHA256SUMS
      - run: cd results/rename-control-v1 && sha256sum -c SHA256SUMS

      # These run end to end from committed artifacts alone. The state-bridge
      # analysis cannot, because its shuffled control needs every state vector
      # and that 272 MB file is not in git. See the reproduce section of
      # README.md.
      - run: python scripts/analyze-state-geometry.py
      - run: python scripts/analyze-mathlib-forward.py
      - run: python scripts/analyze-forward-independence.py
      - run: python scripts/analyze-forward-vocabulary.py
      - run: python scripts/analyze-forward-area.py
      - run: python scripts/analyze-size-confound.py

      # The rename control's two arms, re-derived from their committed
      # centroids and compared against the committed tables numerically. Not by
      # git diff: BLAS sums the 1797x1472 product in a host-dependent order, so
      # an AUC agreeing to eight significant figures still differs in its last
      # bits on another machine. The driver itself needs the 517 MB encode and
      # cannot run here; these are the parts that can.
      - run: |
          mkdir -p "$RUNNER_TEMP/rc"
          python scripts/analyze-mathlib-forward.py --vectors /nonexistent \
            --centroids results/rename-control-v1/centroids-original.npz \
            --out "$RUNNER_TEMP/rc/forward-original.json"
          python scripts/analyze-mathlib-forward.py --vectors /nonexistent \
            --centroids results/rename-control-v1/centroids-alpha.npz \
            --out "$RUNNER_TEMP/rc/forward-alpha.json"
          python scripts/analyze-forward-independence.py \
            --centroids results/rename-control-v1/centroids-alpha.npz \
            --out "$RUNNER_TEMP/rc/independence-alpha.json"
          python scripts/check-committed-numbers.py "$RUNNER_TEMP/rc" results/rename-control-v1 \
            forward-original.json forward-alpha.json independence-alpha.json

      # Nothing above may quietly rewrite a committed result.
      - run: git diff --exit-code
