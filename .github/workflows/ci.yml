name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
      - run: python scripts/verify-strategy-headroom.py
      - run: python scripts/verify-adversarial-result.py
      - run: python scripts/verify-transfer-v2.py
      - run: python scripts/verify-transfer-confirmation.py
      - run: python scripts/verify-gpu-execution.py
      - run: cd results/state-object-v1 && sha256sum -c SHA256SUMS
      - run: python scripts/verify-state-object-archive.py --corpus results/state-object-v1/corpus.json.gz --analysis results/state-object-v1
      - run: cd results/state-identity-audit-v1 && sha256sum -c SHA256SUMS
      - run: python scripts/audit-state-object-inputs.py --output outputs/ci-state-input-audit
      - run: cd results/state-object-records-v1 && sha256sum -c SHA256SUMS
      - run: python scripts/verify-state-record-vectors.py --records results/state-object-records-v1
      - run: python scripts/analyze-state-record-objects.py --records results/state-object-records-v1
      - run: cd results/assumption-audit-v1 && sha256sum -c SHA256SUMS
      - run: python scripts/audit-state-object-assumptions.py --output outputs/ci-assumption-audit
      - run: cd results/theorem-admission-v1 && sha256sum -c SHA256SUMS
      - run: cd results/state-objects-admitted-v1 && sha256sum -c SHA256SUMS
      - run: python scripts/verify-theorem-admission-archive.py
      - run: python scripts/verify-state-record-vectors.py --records results/state-objects-admitted-v1
      - run: python scripts/analyze-state-record-objects.py --records results/state-objects-admitted-v1
      - run: cd results/theorem-forms-v1 && sha256sum -c SHA256SUMS
      - run: python scripts/verify-theorem-forms.py
      - run: python scripts/audit-theorem-form-formatting.py --output outputs/ci-theorem-formatting.json
      - run: cmp results/theorem-forms-v1/formatting-sensitivity.json outputs/ci-theorem-formatting.json
      - run: cd results/theorem-boundaries-v2 && sha256sum -c SHA256SUMS
      - run: python scripts/verify-boundary-explorer.py
      - run: noema synthetic --config configs/smoke.json --output outputs/ci-smoke
