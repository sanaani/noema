[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "noema-geometry"
version = "0.1.0"
description = "Auditable Lean theorem State object geometry experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
plots = ["matplotlib==3.11.2"]

[project.scripts]
noema = "noema.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
# Preserve verbatim third-party source cards and their recorded hashes.
extend-exclude = ["results/state-object-v1/source-manifests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
